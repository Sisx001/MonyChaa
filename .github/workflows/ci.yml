name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Boot smoke test
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 4
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/api/stats > /dev/null
          curl -sf http://localhost:3000/ | grep -q "Secretary Pro"
          kill $SERVER_PID
