services:
  secretary-pro:
    build: .
    container_name: secretary-pro
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
